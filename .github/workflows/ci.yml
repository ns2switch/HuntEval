          set -o pipefail
          ./scripts/ci/r8-supply-chain.sh |& tee .ci-artifacts/r8-supply-chain.log
          ./scripts/ci/r8-signature-fixtures.sh |& tee -a .ci-artifacts/r8-supply-chain.log
          ./scripts/ci/r8-package.sh |& tee -a .ci-artifacts/r8-supply-chain.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r8-supply-chain-log
          path: .ci-artifacts/r8-supply-chain.log
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          python3 --version
      - name: Build uncached release-candidate dry run
        run: |
          ./scripts/ci/cache-parity.sh
          ./scripts/ci/r8-release.sh "${{ runner.temp }}/hunteval-rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hunteval-rc
          if-no-files-found: error
          retention-days: 3
