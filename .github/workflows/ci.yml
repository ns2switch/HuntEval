      - name: Validate and execute the expanded corpus
        env:
          HUNTEVAL_R8_CORPUS_OUTPUT: ${{ github.workspace }}/.ci-artifacts/r8-corpus
        run: ./scripts/ci/r8-corpus.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r8-expanded-corpus-results
          path: |
            .ci-artifacts/r8-corpus/public-corpus-inventory.json
            .ci-artifacts/r8-corpus/corpus-quality.json
            .ci-artifacts/r8-corpus/corpus-quality-secret-scan.json
            .ci-artifacts/r8-corpus/e2e/validation.json
            .ci-artifacts/r8-corpus/e2e/run-summary.json
            .ci-artifacts/r8-corpus/e2e/status.json
            .ci-artifacts/r8-corpus/e2e/comparison.json
            .ci-artifacts/r8-corpus/e2e/benchmark-report.json
            .ci-artifacts/r8-corpus/e2e/benchmark-report.html
            .ci-artifacts/r8-corpus/e2e/verification.json
            .ci-artifacts/r8-corpus/e2e/run-verification.jsonl
            .ci-artifacts/r8-corpus/e2e/generated-secret-scan.json
            .ci-artifacts/r8-corpus/e2e/diagnostic-verification.json
            .ci-artifacts/r8-corpus/e2e/r2-evidence.json
            .ci-artifacts/r8-corpus/e2e/SHA256SUMS
