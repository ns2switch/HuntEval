name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Check lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Check dependencies
        run: cargo deny check

      - name: Check architecture
        run: ./scripts/check-dependency-direction.sh

      - name: Check source size
        run: ./scripts/check-source-size.sh
