name: Release candidate dry run

on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Release candidate dry run
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - name: Build checksummed candidate without publishing a release
        run: ./scripts/ci/release-candidate.sh "${{ runner.temp }}/hunteval-rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hunteval-rc
          if-no-files-found: error
          retention-days: 7
