name: Release candidate dry run

on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-candidate:
    name: Native candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Build, install, and verify the native candidate without publishing
        run: >-
          python scripts/r8_candidate.py
          --target "${{ matrix.target }}"
          --runner "${{ matrix.runner }}"
          --output "${{ runner.temp }}/hunteval-rc/${{ matrix.target }}"
      - name: Scan the native candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: sbom
          scan-ref: ${{ runner.temp }}/hunteval-rc/${{ matrix.target }}/evidence/sbom.spdx.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy-candidate-${{ matrix.target }}.json
          list-all-pkgs: true
          timeout: 10m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/hunteval-rc/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-candidate-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/trivy-candidate-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
