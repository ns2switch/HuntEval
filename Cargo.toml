[workspace]
members = [
    "crates/hunteval-cli",
    "crates/hunteval-commercial",
    "crates/hunteval-domain",
    "crates/hunteval-duckdb",
    "crates/hunteval-evaluation",
    "crates/hunteval-fixture-tool",
    "crates/hunteval-knowledge",
    "crates/hunteval-protocol",
    "crates/hunteval-reference-deployment",
    "crates/hunteval-reporting",
    "crates/hunteval-resilience",
    "crates/hunteval-runner",
    "crates/hunteval-sandbox",
    "crates/hunteval-statistics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ns2switch/HuntEval"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "=1.4.5", features = ["bundled", "parquet"] }
arrow-array = "59.2"
arrow-schema = "59.2"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlparser = { version = "0.62", features = ["visitor"] }
parquet = { version = "59.2", default-features = false, features = ["arrow"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[profile.dev]
debug = 0

[profile.test]
debug = 0
