[workspace]
members = [
    "crates/hunteval-cli",
    "crates/hunteval-domain",
    "crates/hunteval-fixture-tool",
    "crates/hunteval-protocol",
    "crates/hunteval-runner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ns2switch/HuntEval"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
arrow-array = "59.2"
arrow-schema = "59.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
parquet = { version = "59.2", default-features = false, features = ["arrow"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
