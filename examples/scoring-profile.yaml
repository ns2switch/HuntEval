schema_version: "0.4"
id: accuracy-first-0.4
missing_metric_policy: reject
metrics:
  event_precision: {version: "0.3", weight: 0.15}
  event_recall: {version: "0.3", weight: 0.25}
  entity_precision: {version: "0.3", weight: 0.10}
  entity_recall: {version: "0.3", weight: 0.15}
  attack_path_recall: {version: "0.4", weight: 0.10}
  conclusion_correctness: {version: "0.4", weight: 0.10}
  evidence_event_coverage: {version: "0.4", weight: 0.10}
  evidence_sufficiency: {version: "0.4", weight: 0.05}
constraints:
  - kind: metric_threshold
    code: minimum_event_recall
    metric: {name: event_recall, version: "0.3"}
    comparison: minimum
    threshold: 0.70
    disqualifying: true
    required_resource_provenance: none
  - kind: observed_violation
    code: ground_truth_exposure
    disqualifying: true
